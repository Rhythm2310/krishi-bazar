name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install from the frozen lockfile
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Unit tests at seam S1 (domain API)
        run: npm run test:unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Page-flow tests at seam S2
        run: npm run test:e2e

      - name: Production build (adapter-vercel)
        run: npm run build

  ownership-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fail if the PR touches files its task does not own
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
        run: python .jules/tools/ownership_guard.py

  slop-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fail on TODOs, stubs, skipped tests, suppressions or other slop (strict profile)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python .jules/tools/slop_guard.py --strict
